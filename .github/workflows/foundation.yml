name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux Native Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libglib2.0-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libpng-dev libwayland-dev wayland-protocols
      - name: NVIDIA Interface Headers (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fL --max-time 60 https://developer.nvidia.com/downloads/designworks/video-codec-sdk/secure/13.1/video_codec_interface_13.1.15.zip -o /tmp/nvenc-interface.zip
          printf '%s  %s\n' 830180b5a4ca15a4bf99eb94ebd669609a0e5ddca44d8cfc60eff46c3ac4ea23 /tmp/nvenc-interface.zip | sha256sum -c -
          mkdir -p .cache/nvidia
          unzip -n /tmp/nvenc-interface.zip -d .cache/nvidia
          echo "CLOUDPLAY_NVENC_INCLUDE_DIR=$PWD/.cache/nvidia/Video_Codec_Interface_13.1.15/Interface" >> "$GITHUB_ENV"
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build/ci -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          -DCLOUDPLAY_NVENC_INCLUDE_DIR="${{ env.CLOUDPLAY_NVENC_INCLUDE_DIR }}"
          -DCLOUDPLAY_LINUX_CAPTURE=ON -DCLOUDPLAY_LINUX_INPUT=ON
          -DCLOUDPLAY_LINUX_GAMES=ON -DCLOUDPLAY_WAYLAND_MOTION=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Debug
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
  native-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build libpipewire-0.3-dev libglib2.0-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libpng-dev libwayland-dev wayland-protocols
      - name: NVIDIA Interface Headers
        run: |
          curl -fL --max-time 60 https://developer.nvidia.com/downloads/designworks/video-codec-sdk/secure/13.1/video_codec_interface_13.1.15.zip -o /tmp/nvenc-interface.zip
          printf '%s  %s\n' 830180b5a4ca15a4bf99eb94ebd669609a0e5ddca44d8cfc60eff46c3ac4ea23 /tmp/nvenc-interface.zip | sha256sum -c -
          mkdir -p .cache/nvidia
          unzip -n /tmp/nvenc-interface.zip -d .cache/nvidia
          echo "CLOUDPLAY_NVENC_INCLUDE_DIR=$PWD/.cache/nvidia/Video_Codec_Interface_13.1.15/Interface" >> "$GITHUB_ENV"
      - name: Format
        run: find host -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Configure Analysis
        run: >-
          cmake --preset dev
          -DCLOUDPLAY_NVENC_INCLUDE_DIR="${{ env.CLOUDPLAY_NVENC_INCLUDE_DIR }}"
          -DCLOUDPLAY_LINUX_CAPTURE=ON -DCLOUDPLAY_LINUX_INPUT=ON
          -DCLOUDPLAY_LINUX_GAMES=ON -DCLOUDPLAY_WAYLAND_MOTION=ON
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
      - name: Build and Analyze
        run: cmake --build --preset dev --parallel 2
  signaling:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - run: npm ci
      - run: npm run check
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, Test, Lint, Format
        run: bash ./gradlew :core:test :app:assembleDebug :app:lintDebug :ui:lintDebug spotlessCheck --no-daemon
